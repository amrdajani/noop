# Fork-only: build the iOS app for the WHOOP-style redesign branch.
#  - `shots`: Debug simulator build, seeded with --demo-seed, one screenshot per screen (artifact).
#  - `ipa`:   Release device build, unsigned sideload .ipa (artifact), packaged the same way as
#             fork-testing-build.yml.
name: iOS design preview (fork)

on:
  push:
    branches: [ios-whoop-style]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-design-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl ui "$UDID" appearance dark || true
      - name: Build NOOPiOS for simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -scheme NOOPiOS -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E 'error:|warning: unre|BUILD (SUCCEEDED|FAILED)' | head -200
      - name: Compile errors (if any)
        if: failure()
        run: grep -E '(error|fatal error):' build.log | sort -u | head -150 || true
      - name: Capture screenshots
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build/dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -type d | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          mkdir -p shots
          # First-run flow on the fresh install, before anything is seeded.
          # (a) No arguments: the Terms acknowledgment gate.
          xcrun simctl launch "$UDID" "$BID"; sleep 12
          xcrun simctl io "$UDID" screenshot shots/first-run-terms.png
          xcrun simctl terminate "$UDID" "$BID" || true
          # (b) Terms marked accepted through the UserDefaults argument domain (Terms.currentVersion),
          #     so the onboarding wizard shows. Nothing is persisted by this override.
          xcrun simctl launch "$UDID" "$BID" -noop.acceptedTermsVersion 2.0; sleep 12
          xcrun simctl io "$UDID" screenshot shots/first-run-onboarding.png
          xcrun simctl terminate "$UDID" "$BID" || true
          # Seed once (first launch populates the store), then capture.
          xcrun simctl launch "$UDID" "$BID" --demo-seed -theme.appearance dark; sleep 25
          xcrun simctl io "$UDID" screenshot shots/00-shell.png
          xcrun simctl terminate "$UDID" "$BID" || true
          for s in liquidtoday trends sleep live stress workouts health insights explore compare settings devices fitnessage vitality chargebreakdown addwizard whatsnew terms onboarding coach intelligence hydration breathing alarms insightshub labbook datasources automations; do
            xcrun simctl launch "$UDID" "$BID" --demo-seed --demo-screen "$s" -theme.appearance dark; sleep 12
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
            xcrun simctl terminate "$UDID" "$BID" || true
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: |
            shots/
            build.log
          if-no-files-found: ignore

  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS for device (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E 'error:|BUILD (SUCCEEDED|FAILED)' | head -200
      - name: Package sideload .ipa
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app (iphoneos) not found"; exit 1; }
          rm -rf "$APP/Watch"
          Tools/prepare-ios-sideload-app.sh "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr NOOP-ios-whoop-style-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: NOOP-ios-whoop-style-unsigned.ipa
